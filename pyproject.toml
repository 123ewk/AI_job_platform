[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakejobai-job-radar"
version = "0.1.0"
description = "BOSS直聘岗位雷达 · AI驱动的智能求职助手"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "lakejob" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pymysql>=1.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
lakejob = "lakejob_cli.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"
# 门禁范围：新代码（tests/ agent/ db/ interview/）全量 lint；
# 雷达存量大文件存在历史 lint 债（从未跑过 lint），待 SDD Phase 1.3 逐文件
# 切换数据层时再逐个纳入 lint 范围，避免"一步做两件事"。
extend-exclude = [
    "boss_firefox.py",
    "boss_state.py",
    "boss_geo.py",
    "lakejob_cli",
    # interview/ 仅 llm_client.py 在 lint 范围内（SDD 0.2 起有改动），其余为存量
    "interview/batch_seed.py",
    "interview/benchmark.py",
    "interview/config.py",
    "interview/db.py",
    "interview/engine.py",
    "interview/fast_qa.py",
    "interview/main.py",
    "interview/seed_data.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["lakejob_cli"]
